# Default values for hermesgate.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Since the default configuration uses an SQLite persistent database,
# replicaCount must remain 1 to avoid multiple concurrent writers to the same file.
replicaCount: 1

image:
  repository: hermesgate
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Application Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: hermesgate.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: hermesgate-tls
  #    hosts:
  #      - hermesgate.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Persistent storage for the SQLite database
persistence:
  enabled: true
  # StorageClass to use. If empty or omitted, cluster default is used.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data
  # If you want to reuse an existing PVC:
  existingClaim: ""

# Application configuration options
config:
  host: "0.0.0.0"
  port: 8080
  databasePath: "/data/sms_forwarder.db"
  # Pre-configure a Master Admin Token. If left blank, one will be generated on startup.
  adminToken: ""
  # Use an existing Kubernetes secret for the admin token
  existingSecret: ""
  existingSecretKey: "ADMIN_TOKEN"

# Additional environment variables to pass into the container
extraEnv: []
#  - name: RUST_LOG
#    value: "sms_forwarder_server=debug"

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
